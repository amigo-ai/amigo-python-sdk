name: Test

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      skip_codecov:
        description: "Skip Codecov upload"
        required: false
        default: true
        type: boolean

jobs:
  test:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run linter
        run: ruff check .

      - name: Run formatter check
        run: ruff format --check .

      - name: Run type check
        if: matrix.python-version == '3.13'
        run: mypy src/amigo_sdk/ --ignore-missing-imports

      - name: Run tests with coverage
        run: pytest --cov=src --cov-report=xml --cov-report=term

      - name: Upload coverage reports to Codecov
        if: inputs.skip_codecov != true && matrix.python-version == '3.13'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: true

  integration-test:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # Integration tests are informational — failures don't block PRs or releases.
    # Skip for PRs from forks (they don't have access to secrets) and workflow_call (release).
    continue-on-error: true
    if: >
      github.event_name != 'workflow_call' &&
      (github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository)

    steps:
      - name: Check integration environment
        id: integration-env
        env:
          AMIGO_API_KEY: ${{ secrets.AMIGO_API_KEY }}
          AMIGO_API_KEY_ID: ${{ secrets.AMIGO_API_KEY_ID }}
          AMIGO_ORGANIZATION_ID: ${{ secrets.AMIGO_ORGANIZATION_ID }}
          AMIGO_USER_ID: ${{ secrets.AMIGO_USER_ID }}
          AMIGO_TEST_SERVICE_ID: ${{ secrets.AMIGO_TEST_SERVICE_ID }}
        run: |
          missing=()
          for var in AMIGO_API_KEY AMIGO_API_KEY_ID AMIGO_ORGANIZATION_ID AMIGO_USER_ID AMIGO_TEST_SERVICE_ID; do
            if [ -z "${!var}" ]; then
              missing+=("$var")
            fi
          done

          if [ ${#missing[@]} -gt 0 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Skipping integration tests because required secrets are unavailable: ${missing[*]}"
            exit 0
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        if: steps.integration-env.outputs.ready == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Python
        if: steps.integration-env.outputs.ready == 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        if: steps.integration-env.outputs.ready == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run integration tests
        if: steps.integration-env.outputs.ready == 'true'
        env:
          AMIGO_API_KEY: ${{ secrets.AMIGO_API_KEY }}
          AMIGO_API_KEY_ID: ${{ secrets.AMIGO_API_KEY_ID }}
          AMIGO_ORGANIZATION_ID: ${{ secrets.AMIGO_ORGANIZATION_ID }}
          AMIGO_USER_ID: ${{ secrets.AMIGO_USER_ID }}
          AMIGO_BASE_URL: ${{ secrets.AMIGO_BASE_URL }}
          AMIGO_TEST_SERVICE_ID: ${{ secrets.AMIGO_TEST_SERVICE_ID }}
        run: pytest -m integration -v -s --no-cov
